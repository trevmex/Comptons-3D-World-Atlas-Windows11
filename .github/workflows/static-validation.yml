name: Static validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check archive synchronizer syntax
        run: node --check scripts/Sync-AtlasLocalArchive.js
      - name: Verify published x86 shim artifact
        shell: pwsh
        run: |
          $artifact = 'build/Wlbrw32.dll'
          $sidecar = 'build/Wlbrw32.dll.sha256'
          if (-not (Test-Path $artifact) -or -not (Test-Path $sidecar)) { throw 'The published archive shim artifact or hash is missing.' }
          $expected = ((Get-Content -Raw $sidecar).Trim() -split '\s+')[0].ToUpperInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 $artifact).Hash
          if ($actual -ne $expected) { throw "Shim hash mismatch: $actual != $expected" }
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $artifact))
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x014c) { throw "The published shim is not x86 (machine 0x{0:X4})." -f $machine }
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            try { [void][scriptblock]::Create((Get-Content -Raw $_.FullName)) }
            catch { $errors += "$($_.Name): $($_.Exception.Message)" }
          }
          if ($errors) { $errors | Write-Error; exit 1 }
      - name: Build native archive shim
        shell: pwsh
        run: .\scripts\Build-WonderLink-Archive.cmd
      - name: Refresh built shim hash
        shell: pwsh
        run: (Get-FileHash -Algorithm SHA256 build/Wlbrw32.dll).Hash + '  Wlbrw32.dll' | Set-Content build/Wlbrw32.dll.sha256 -Encoding ASCII
      - name: Install Inno Setup
        shell: pwsh
        run: winget install --id JRSoftware.InnoSetup --exact --scope user --silent --accept-source-agreements --accept-package-agreements
      - name: Build Windows installer
        shell: pwsh
        run: .\installer\Build-AtlasInstaller.ps1
